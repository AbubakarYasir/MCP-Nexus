name: MCP Nexus CI

on:
  push:
    branches:
      - main
      - feat/all-mcp-research-stack
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # The upstream i18n package generates build-time files during the
      # normal build pipeline, so build once before running the workspace-wide
      # standalone type-check.
      - name: Build extension
        run: pnpm build

      - name: Type check
        run: pnpm type-check
