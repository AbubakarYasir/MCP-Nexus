name: MCP Nexus CI

on:
  push:
    branches:
      - main
      - feat/all-mcp-research-stack
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Discovery regression tests
        run: pnpm test:nexus-discovery

      - name: Build extension
        run: pnpm build

      - name: Type check Nexus extension
        run: pnpm --filter mcp-nexus-extension type-check

      # The inherited content-script workspace currently has unrelated
      # TypeScript debt (DOM iterable, Node timeout and import.meta.env types).
      # Keep it visible without blocking Nexus discovery work.
      - name: Legacy workspace type check
        continue-on-error: true
        run: pnpm type-check
